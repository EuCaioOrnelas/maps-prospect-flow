  <body>
    <script>
      (function(){
        try {
          var doc = document.documentElement;
          var path = window.location.pathname || '';
          // Public/light routes always render in light mode to avoid dark flash
          var lightRoutes = ['/', '/login', '/signup', '/onboarding', '/checkout', '/checkout-card', '/vendas', '/trial-expired', '/upgrade', '/consultoria'];
          var isLightRoute = lightRoutes.some(function(r){
            return r === '/' ? path === '/' : path.indexOf(r) === 0;
          });

          // Default is ALWAYS light. Dark only when the user explicitly saved it.
          var saved = null;
          try { saved = localStorage.getItem('dashboard-theme'); } catch (e) {}
          var isDark = !isLightRoute && saved === 'dark';

          doc.classList.remove('dark');
          if (isDark) {
            doc.classList.add('dark');
            doc.classList.remove('landing-light');
            doc.style.colorScheme = 'dark';
          } else {
            doc.classList.add('landing-light');
            doc.style.colorScheme = 'light';
            doc.style.backgroundColor = '#ffffff';
          }

          document.addEventListener('DOMContentLoaded', function(){
            if (!document.body) return;
            document.body.classList.toggle('landing-light', !isDark);
            document.body.style.colorScheme = isDark ? 'dark' : 'light';
            if (!isDark) document.body.style.backgroundColor = '#ffffff';
          });
        } catch(e){}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
